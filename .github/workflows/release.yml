name: Release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
  workflow_dispatch:

# Serialize releases on the same ref; never cancel a half-created release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count (PATCH) is correct

      # MAJOR.MINOR comes from manifest.json (e.g. 0.1). PATCH is the total commit
      # count (the "commit number"), so the version auto-advances on every release.
      - name: Compute version
        id: version
        run: |
          BASE="$(jq -r '.version' custom_components/car2home/manifest.json)"
          MAJOR_MINOR="$(printf '%s' "$BASE" | cut -d. -f1,2)"
          if [ -z "$MAJOR_MINOR" ] || [ "$BASE" = "null" ]; then
            echo "::error::Could not read MAJOR.MINOR from custom_components/car2home/manifest.json"
            exit 1
          fi
          PATCH="$(git rev-list --count HEAD)"
          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version $VERSION (base $BASE, PATCH = commit count $PATCH)"

      - name: Check whether release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Stamp the computed version into the manifest that goes INTO the zip only.
      # The repo manifest stays as the MAJOR.MINOR template (e.g. 0.1.0); HACS installs
      # from the zip, so users get the real version and entity.py reports it correctly.
      - name: Stamp computed version into manifest (zip only, not committed)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          tmp="$(mktemp)"
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            custom_components/car2home/manifest.json > "$tmp"
          mv "$tmp" custom_components/car2home/manifest.json

      # zip_release in hacs.json expects the integration files at the archive root
      # (manifest.json, __init__.py, translations/ ...), NOT wrapped in a car2home/ folder.
      - name: Build integration zip (files at archive root)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cd custom_components/car2home
          zip -r "${{ github.workspace }}/car2home.zip" ./

      # HACS renders the RELEASE BODY as the changelog, both in its update dialog and in
      # Settings > Updates. --generate-notes produced only "Full Changelog: <compare link>"
      # here, because the commits land straight on main with no pull requests to list — so
      # every user saw a link instead of a changelog. Build the body from the commit bullets
      # instead: the messages already are one "- type: what changed" line per front of work.
      - name: Build release notes from the commits
        if: steps.check_release.outputs.exists == 'false'
        run: |
          PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          echo "Collecting bullets over $RANGE"

          # Only commits that touched the integration, and only the user-facing bullet types:
          # ci/chore/build/test/docs churn is noise in a changelog a driver reads.
          git log --format=%B "$RANGE" -- custom_components/ \
            | sed -E 's/\r$//' \
            | grep -E '^[[:space:]]*-[[:space:]]*(feat|fix|perf|ref|refactor)(\([^)]*\))?:' \
            | sed -E 's/^[[:space:]]*-[[:space:]]*//' \
            | awk '!seen[$0]++' \
            | sed -E 's/^/- /' > notes.md || true

          # Never ship an empty body: fall back to the commit subjects, then to a plain line.
          if [ ! -s notes.md ]; then
            git log --format='- %s' "$RANGE" -- custom_components/ | awk '!seen[$0]++' > notes.md || true
          fi
          if [ ! -s notes.md ]; then
            echo "- Maintenance release" > notes.md
          fi

          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...v%s\n' \
              "${{ github.server_url }}/${{ github.repository }}" "$PREV" "${{ steps.version.outputs.version }}" >> notes.md
          fi

          echo "--- release notes ---"
          cat notes.md

      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            "${{ github.workspace }}/car2home.zip"
