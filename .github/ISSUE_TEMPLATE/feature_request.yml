name: Feature request
description: Suggest an idea or enhancement for Car 2 Home
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For feature requests and enhancements only. Use the Bug report form for bugs and
        [Discussions](https://github.com/car2home/car2home-homeassistant/discussions) for
        questions.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve? Ex. "I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
