name: Bug report
description: Report a problem with the Car 2 Home integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! This form is for bugs only — use
        [Discussions](https://github.com/car2home/car2home-homeassistant/discussions) for
        questions and the Feature request form for ideas.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I updated the integration to the latest version.
          required: true
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I checked the Home Assistant logs for related errors.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Shown in HACS or in custom_components/car2home/manifest.json.
      placeholder: e.g. 0.1.10
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2025.5.1
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Home Assistant installation type
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Car 2 Home app version & platform
      description: Version of the mobile app sending telemetry, and Android or iOS.
      placeholder: e.g. 1.4.2 (Android 14)
  - type: dropdown
    id: transport
    attributes:
      label: Transport / sync mode when the problem happens
      options:
        - WebSocket (Online)
        - HTTP fallback
        - Wi-Fi only sync mode
        - Not sure
  - type: input
    id: vehicle
    attributes:
      label: Vehicle (make / model / year)
      placeholder: e.g. Toyota Corolla Cross 2023
  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs
      description: >-
        Enable debug logging for custom_components.car2home and paste related lines.
        This is automatically formatted into code, so backticks are not needed.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: >-
        Settings -> Devices & Services -> Car 2 Home -> three-dots menu -> Download
        diagnostics. Redact any tokens before attaching.
  - type: textarea
    id: context
    attributes:
      label: Additional context
